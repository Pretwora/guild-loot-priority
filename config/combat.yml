# Каталог боевых способностей для метрик эффективности из лога боя (combatlog).
# Опознание по подстроке имени (имена заклинаний в логе — стандартные локализованные,
# устойчивее серверных spell id) плюс явные spell_ids. Считается детерминированно при
# сборке из компактной выжимки лога, поэтому каталог можно править и пересобирать без
# перекачки логов.
#
# 🛑 Каталог СЕРВЕРНЫЙ и приблизительный — проверь и дополни под свой ростер. Что не
# опознано — просто не учитывается (не штрафует), молча не угадываем (принцип 2 SPEC).

interrupts:
  # перебивания каста (кик). Утилити считается перцентилем ВНУТРИ роли, так что
  # хилский диспел не «побьёт» дпс — сравнение внутри своих.
  name_contains:
    - Порыв # Wind Shear (шаман) — подтверждён в логах
    - Пинок # Kick (разбойник)
    - Ошеломл # Pummel (воин)
    - Контрзакл # Counterspell (маг)
    - Обуздание # Mind Freeze (рыцарь смерти)
    - Раскол черепа # Skull Bash (друид)
    - Немота # Silence
    - Тишина
    - Порицание # Rebuke (паладин)
  spell_ids: [33357]

dispels:
  # снятие магии/проклятий/ядов, очищение, успокоение
  name_contains:
    - Очищ # Purge (шаман) / Cleanse (паладин) — подтверждён (4987)
    - Развеив # Развеивание магии
    - Развеять
    - Снятие прокл # Снятие проклятия (маг)
    - Массовое разв # Mass Dispel
    - Успокаивающий # Tranquilizing Shot (охотник)
    - Отречение
  spell_ids: [4987]

consumables:
  # 🛑 aura spellId флаконов / эликсиров / зелий боя. СЕРВЕРНЫЕ — по умолчанию ПУСТО.
  # Пока список пуст (или расходники видны у слишком малой доли рейда) штраф за
  # отсутствие расходников ВЫКЛЮЧЕН safety-valve'ом — чтобы неверный каталог не наказал
  # всех. Заполни реальными id, и метрика включится.
  aura_ids: []
