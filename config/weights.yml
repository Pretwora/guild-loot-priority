# Все веса и константы формул приоритета. В коде — ни одного магического числа
# (принцип 3 SPEC). Каждое значение объяснимо одной фразой (принцип 7 SPEC).
#
# ЗАМОРОЖЕНО НА ТИР. Менять только через PR с описанием причины (принцип 6 SPEC):
# правка весов посреди тира обесценивает накопленное и рушит доверие к системе.

schema_version: 1
tier: T4 # с какого тира заморожены эти веса

# ─────────────────────────────────────────────────────────────────────────────
# Сборка рейд-вечеров (раздел 2 SPEC)
# ─────────────────────────────────────────────────────────────────────────────
raid_night:
  gap_hours: 3 # разрыв > 3ч между килами → новый вечер. Границы по локальному времени сервера.

# ─────────────────────────────────────────────────────────────────────────────
# A — посещаемость, 0..1 (раздел 7.1)
# ─────────────────────────────────────────────────────────────────────────────
attendance:
  window_weeks: 8 # окно: последние 8 недель ИЛИ...
  window_nights: 12 # ...последние 12 вечеров — что БОЛЬШЕ
  decay_lambda: 0.98 # вес вечера = λ^days_ago, полураспад ≈34 дня
  present_full_threshold: 0.80 # был на ≥80% килов вечера → кредит 1.0
  present_partial_floor: 0.30 # был на 30–80% → кредит = фактическая доля; ниже 30% считаем как долю тоже, но см. код
  credit_bench: 1.0 # бенч: пришёл, сажали вы → полный кредит
  credit_absent: 0.0 # не пришёл → 0
  excused_max_consecutive: 2 # отпросился: вечер вне знаменателя, но не более 2 подряд
  confidence_nights: 6 # conf = min(1, вечеров/6): сжатие к среднему для малой выборки

# ─────────────────────────────────────────────────────────────────────────────
# P — перформанс, 0..1 (раздел 7.2)
# ─────────────────────────────────────────────────────────────────────────────
performance:
  # Перформанс меряется ТОЛЬКО у этих ролей. Танки/хилы слишком ситуативны (мейн- vs
  # офф-танк, оверхил, беготня по механике) — мерить бессмысленно, а полезны они по
  # определению (без них рейд не закрыть). У неизмеряемых ролей перформанс НЕ входит в
  # рейтинг: его вес уходит в посещаемость, игрок судится по посещаемости и луту.
  measured_roles: [dps]
  min_sample: 5 # <5 записей того же спека на том же боссе → p=0.5 (мало данных = нейтрально)
  neutral: 0.5 # нейтральное значение: малая выборка, отсутствие метрики
  window_kills: 12 # итог = медиана перцентилей за последние 12 килов

  # Метрики из детального лога боя (combatlog). Всё под общим потолком перформанса 30%.
  # Базовый перцентиль по роли: дпс → урон, хил → лечение, ТАНК → полученный урон/сек
  # (меньше = лучше митигация; раньше был фиксированный 0.5, API сводки не давал урон).
  tank_metric: taken # источник базового перцентиля танка; неизвестен/мало данных → neutral
  tank_lower_is_better: true # меньше полученного урона на боссе относительно танков = выше
  # Модификаторы к перцентилю (в пределах 0..1), считаются покилово:
  util_weight: 0.10 # максимум прибавки за утилити (перебивания+диспелы), перцентиль внутри роли
  death_penalty: 0.15 # штраф за смерть в бою (за каждую; совет может поправить adjustments.yml)
  consumable_penalty: 0.05 # штраф, если в бою не стоял боевой расходник (флакон/эликсир/зелье)
  consumable_min_coverage: 0.4 # если расходники опознаны у <40% рейда — каталог не совпал, штраф ВЫКЛ

# ─────────────────────────────────────────────────────────────────────────────
# L — полученный лут (раздел 7.3)
# ─────────────────────────────────────────────────────────────────────────────
loot:
  decay_lambda: 0.985 # вес выдачи = λ^days_ago, полураспад ≈46 дней
  norm_clip_max: 2.0 # L_norm = clip(L/reference, 0, 2) → максимум ≈ −41% рейтинга

  # L нормируется НЕ по медиане гильдии, а по фикс-шкале norm_reference (≈ «один БиС-предмет»).
  # При нормировке по медиане абсолютный вес не влиял бы (медиана «съедает» его) и лёгкая
  # броня резала бы рейтинг так же, как оружие. Фикс-шкала → броня реально отнимает мало.
  norm_reference: 1.0
  norm_eps: 0.001 # (совместимость; при фикс-шкале не используется)

  # Множитель к весу предмета по типу выдачи (раздел 6.3).
  # shard/de — не учитывается вообще (в коде — пропуск строки).
  award_type_mult:
    bis: 1.0 # в основной спек
    offspec: 0.0 # в запасной спек — рейтинг НЕ снимаем (решение совета): офспек-лут не в счёт
    free: 0.0 # никому не нужен, отдали лишь бы не пропало
    trade: 1.0 # передан позже
    shard: null # не учитывается
    de: null # не учитывается

  # Вес полученного предмета за штуку (правило совета, раздел 7.3):
  #   • тринкеты, оружие (1h/2h/дальнобой), токены/печеньки — БиС (weight_bis), большой минус;
  #   • вся прочая броня — weight_armor, «отнимает мало» и ОДИНАКОВО по слотам (сровняли);
  #   • рецепты/расходники/непонятное — weight_recipe, символически.
  # Тринкеты/оружие считаются БиС только с ilvl_bis+ (старьё рейтинг не режет); токены — всегда.
  ilvl_bis: 258       # порог «топ-шмота» текущего тира (ТОК = 258)
  weight_bis: 1.0     # тринкет, оружие, токен/печеньки при ilvl_bis+
  weight_armor: 0.15  # вся прочая броня — мало и одинаково
  weight_recipe: 0.05 # рецепты/расходники/непонятное
  bis_slots: [trinket, two_hand, one_hand, ranged] # высоковесные при ilvl_bis+
  token_slots: [token, tier_token]                  # печеньки/тир-токены — БиС без порога

# ─────────────────────────────────────────────────────────────────────────────
# S — итоговый рейтинг игрока (раздел 7.4)
# S = 100 × (w_att×A_eff + w_perf×P) / (1 + loot_penalty×L_norm) × rank_gate
# ─────────────────────────────────────────────────────────────────────────────
score:
  scale: 100
  w_attendance: 0.70 # вклад посещаемости
  w_perf: 0.30 # вклад перформанса ограничен 30% сознательно (иначе топ-дпс забирает всё)
  loot_penalty_k: 0.35 # чем больше уже получил, тем ниже приоритет
  rank_gate: # триал растёт внутри своей группы, но не перепрыгивает состав
    trial: 0.6
    member: 1.0
    officer: 1.0

# ─────────────────────────────────────────────────────────────────────────────
# Fit — соответствие предмета игроку, 0..1 (раздел 7.5)
# F = need × slot_gap × set_bonus
# ─────────────────────────────────────────────────────────────────────────────
fit:
  need_main: 1.0 # предмет подходит основному спеку
  need_offspec: 0.3 # запасному
  need_none: 0.0 # не подходит
  slot_gap_saturation_weeks: 12 # прокси нужды: недель с последней выдачи в слот, насыщение на 12
  slot_gap_never: 1.0 # никогда не получал в этот слот → максимальная нужда
  set_bonus_completes: 1.25 # токен закрывает 2- или 4-сет
  set_bonus_default: 1.0

# ─────────────────────────────────────────────────────────────────────────────
# Кандидаты на предмет (раздел 7.6)
# ─────────────────────────────────────────────────────────────────────────────
candidates:
  top_n: 5 # показывать топ-5 с разбивкой компонентов

# ─────────────────────────────────────────────────────────────────────────────
# Запись на рейд (raid-helper) — небольшой бонус за ответственность (запросил РЛ)
# ─────────────────────────────────────────────────────────────────────────────
signup:
  window_events: 8 # учитываем последние N ивентов записи
  bonus_signed: 0.02 # прибавка к merit за подтверждённую запись (≈ +2 к рейтингу)
  bonus_tentative: 0.01 # за «может быть» (tentative)
  cap: 0.06 # потолок суммарной прибавки (чтобы «чуть-чуть», а не доминировало)
