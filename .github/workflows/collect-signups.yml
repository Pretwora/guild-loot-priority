# .github/workflows/collect-signups.yml
#
# Забирает записи на рейд из raid-helper по ссылке и коммитит как сырьё.
# Запуск: Actions → collect-signups → Run workflow → вставить ссылку на ивент.
# Коммит в data/raw/signups/ запускает build → бонус за запись пересчитывается и деплоится.

name: collect-signups

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Ссылка на ивент raid-helper (или id ивента)"
        required: true

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Забрать записи
        run: python3 tools/collect_signups.py --url "${{ inputs.url }}"

      - name: Коммит
        run: |
          if [ -z "$(git status --porcelain data/raw/signups)" ]; then
            echo "Изменений нет"; exit 0
          fi
          git config user.name  "loot-collector"
          git config user.email "actions@github.com"
          git add data/raw/signups
          git commit -m "signups: запись на рейд ($(date -u '+%Y-%m-%d %H:%M UTC'))"
          git pull --rebase --autostash origin main
          git push
