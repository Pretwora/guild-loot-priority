# .github/workflows/loot-intake.yml
#
# Разбор issue с лутом при его закрытии (этап 4 SPEC). Рейд-лидер заполняет
# получателей прямо в браузере; на закрытии бот валидирует, дописывает loot_log.csv
# и коммитит. Строка, не сошедшаяся с дропом кила, отклоняется с комментарием.

name: loot-intake

on:
  issues:
    types: [closed]

permissions:
  contents: write
  issues: write

jobs:
  intake:
    # только issue с меткой loot
    if: contains(join(github.event.issue.labels.*.name, ','), 'loot')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Тело issue → файл
        env:
          BODY: ${{ github.event.issue.body }}
        run: printf '%s' "$BODY" > issue_body.md

      - name: Разбор и дозапись loot_log.csv
        id: apply
        continue-on-error: true
        run: python3 tools/apply_loot_issue.py --config config/config.json --body issue_body.md

      - name: Комментарий с результатом
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment ${{ github.event.issue.number }} --body-file loot_errors.md

      - name: Коммит loot_log.csv
        run: |
          if [ -z "$(git status --porcelain data/manual/loot_log.csv)" ]; then
            echo "Изменений в loot_log нет"; exit 0
          fi
          git config user.name  "loot-intake"
          git config user.email "actions@github.com"
          git add data/manual/loot_log.csv
          git commit -m "loot: issue #${{ github.event.issue.number }} ($(date -u '+%Y-%m-%d %H:%M UTC'))"
          git pull --rebase --autostash origin main
          git push

      - name: Переоткрыть issue, если были ошибки разбора
        if: steps.apply.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue reopen ${{ github.event.issue.number }}
