# Ручная разметка предметов, которые каскад «кому нужен предмет» (раздел 8 SPEC)
# не смог развести однозначно. Молча угадывать нельзя — предмет висит на дашборде
# как «требует разметки», пока сюда не добавят запись. Ревьюится человеком (принцип 2).
#
# Ключ — item_entry. Поля переопределяют/дополняют карточку предмета:
#   slot        — канонический слот (two_hand|one_hand|ranged|head|shoulder|chest|
#                 wrist|hands|waist|legs|feet|finger|back|neck|trinket|tier_token|
#                 recipe|consumable)
#   classes     — список class_id, которым предмет вообще подходит (пусто = никому)
#   specs       — опционально, список [class_id, spec] для точечной привязки
#   tier_token  — true, если это тир-токен (влияет на set_bonus)
#   note        — зачем правка (желательно)
#
# Пример:
# 158159:
#   slot: two_hand
#   classes: [7, 11, 5]        # шаман/друид/жрец — посох каст/хила
#   note: "Посох ярости природы — caster staff, разведён вручную"

overrides: {}
