# Посещаемость — только то, чего НЕТ в логах (раздел 6.2 SPEC).
# Ключ — дата рейд-вечера (YYYY-MM-DD, серверная локальная).
# Игроки указываются по player id из roster.yml (не по имени персонажа).
#
#   bench   — пришли, посадили: засчитывается как ПОЛНОЕ присутствие
#   late    — опоздали: засчитывается по фактической доле килов из логов
#   excused — предупредил заранее: вечер исключается из знаменателя (но не более 2 подряд)
#   perf    — ручной перф-кредит {pid: 0..1}: игрок ушёл по болезни/техпроблеме, совет
#             засчитывает справедливый перф вместо отсутствия данных (идёт в медиану перфа)
#
# Пример (заполнять после рейда):
# 2026-08-30:
#   bench: [nirva, kettle]
#   late: [dorn]
#   excused: [milk]
#   perf: {nirva: 0.8}

2026-09-18:
  # Urshifu пришёл на РТ, стало плохо — отпустили; совет: полное присутствие + перф 0.8
  bench: [urshifu]
  perf: {urshifu: 0.8}
