# Ручные корректировки совета (раздел 6.4 SPEC). Поле reason ОБЯЗАТЕЛЬНО —
# дашборд публичный, немотивированная правка рейтинга хуже её отсутствия.
#
# player   — id из roster.yml
# date     — когда применена (YYYY-MM-DD)
# type     — boost | penalty | freeze
#            boost/penalty — аддитивная поправка к нормированному вкладу (value в 0..1 шкале
#                            слагаемого посещаемость+перформанс, до множителя лута и rank_gate);
#            freeze        — заморозить рейтинг игрока (value игнорируется).
# value    — величина поправки (для boost/penalty)
# expires  — дата окончания действия (после неё поправка не применяется)
# reason   — человекочитаемое обоснование (обязательно)
#
# Пример:
# - player: dorn
#   date: 2026-08-25
#   type: boost
#   value: 0.15
#   expires: 2026-09-25
#   reason: "Фарм расходников на всю гильдию весь тир"

adjustments: []
