# Ростер: персонаж → игрок (раздел 6.1 SPEC). Без него система разваливается
# на второй неделе: на рейде один человек ходит разными персонажами, а API
# знает только персонажа.
#
# ВАЖНО: это файл ПРАВОК, а не полный список. Базовый состав = все персонажи нашей
# гильдии, у кого есть парсы в логах (сирус их знает) — они добавляются авто-игроками
# при сборке. Здесь перечисляем только тех, кого надо уточнить/поправить:
#   • объединить твинков одного человека в один player (несколько characters);
#   • display / rank (trial|member|officer);
#   • team — РЕЙД-СОСТАВ (два состава по 10, см. docs/api-schema.md); null = все вечера;
#   • discord_id: <userid> — чтобы записи в raid-helper матчились по Discord, а не по нику
#     (userid непойманных записей — в отчёте дашборда «записи без ростера»).
#   Пуги из чужих гильдий сюда НЕ включены (у них другая гильдия в логах).

